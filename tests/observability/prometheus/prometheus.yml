# ════════════════════════════════════════════════════════════════
#  Configuração do Prometheus — UniReservas
# ════════════════════════════════════════════════════════════════
global:
  scrape_interval: 15s        # frequência padrão de coleta
  evaluation_interval: 15s    # frequência de avaliação de regras/alertas
  external_labels:
    monitor: unireservas

# Regras de alerta e de gravação (recording rules)
rule_files:
  - /etc/prometheus/alerts/*.yml

# Alertmanager (opcional — preencha os targets para habilitar)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ── O próprio Prometheus ─────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── API UniReservas (FastAPI /metrics) ───────────────────────
  # host.docker.internal funciona tanto com a API local (uvicorn)
  # quanto com a API no docker-compose principal (porta 8000 exposta).
  - job_name: unireservas-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: unireservas-api
          component: backend

  # ── Locust (testes de carga) ─────────────────────────────────
  - job_name: locust
    metrics_path: /metrics
    static_configs:
      - targets: ["locust-exporter:9646"]
        labels:
          service: locust
          component: loadtest

  # ── Node Exporter (host) — profile: system ───────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host

  # ── cAdvisor (containers) — profile: system ──────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: containers
