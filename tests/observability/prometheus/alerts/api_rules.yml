# ════════════════════════════════════════════════════════════════
#  Regras de gravação (recording) e alertas — API UniReservas
# ════════════════════════════════════════════════════════════════
groups:
  # ── Recording rules: pré-calculam séries usadas nos dashboards ──
  - name: unireservas_api_recording
    interval: 15s
    rules:
      - record: job:http_requests:rate1m
        expr: sum(rate(http_requests_total{job="unireservas-api"}[1m]))

      - record: job:http_requests_errors:rate5m
        expr: sum(rate(http_requests_total{job="unireservas-api", status=~"5.."}[5m]))

      - record: job:http_request_error_ratio:5m
        expr: |
          sum(rate(http_requests_total{job="unireservas-api", status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{job="unireservas-api"}[5m])), 1)

      - record: job:http_request_latency_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="unireservas-api"}[5m])) by (le)
          )

  # ── Alertas ──────────────────────────────────────────────────
  - name: unireservas_api_alerts
    rules:
      - alert: APIDown
        expr: up{job="unireservas-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API UniReservas indisponível"
          description: "O alvo {{ $labels.instance }} não responde ao scrape há mais de 1 minuto."

      - alert: HighErrorRate
        expr: job:http_request_error_ratio:5m > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erros 5xx elevada (> 5%)"
          description: "A taxa de erros do servidor está em {{ $value | humanizePercentage }} nos últimos 5 minutos."

      - alert: HighLatencyP95
        expr: job:http_request_latency_p95:5m > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latência p95 alta (> 1s)"
          description: "A latência p95 está em {{ $value }}s nos últimos 5 minutos."

      - alert: TrafficSpike
        expr: job:http_requests:rate1m > 200
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Pico de tráfego (> 200 req/s)"
          description: "A API está recebendo {{ $value }} req/s — avaliar capacidade."
