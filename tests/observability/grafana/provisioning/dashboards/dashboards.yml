# Provider que carrega os dashboards JSON do diretório montado
apiVersion: 1

providers:
  - name: UniReservas
    orgId: 1
    folder: UniReservas
    folderUid: unireservas
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
