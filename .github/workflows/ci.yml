name: CI

# Pipeline de integração contínua do UniReservas.
# Roda em todo push e pull request para a branch main, validando backend e
# frontend de forma independente e paralela.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas da mesma ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Backend — FastAPI / Python
  # Instala as dependências e roda a suíte de testes unitários (pytest).
  # Os testes cobrem unidades puras (settings, enums, parsing, validação de
  # modelos).
  # ──────────────────────────────────────────────
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes (pytest)
        run: pytest tests/ -v

  # ──────────────────────────────────────────────
  # Frontend — React 19 + TypeScript + Vite
  # Lint (ESLint) → testes (Vitest) → build de produção (Vite).
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários (Vitest)
        run: npm test

      - name: Build de produção (Vite)
        run: npm run build
